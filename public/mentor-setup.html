<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Password Setup — ACE Engineering College</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 9999px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            animation: ace-spin 0.7s linear infinite;
            vertical-align: -2px;
        }
        @keyframes ace-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-r from-blue-800 to-indigo-800 p-6 text-white">
                <h1 class="text-lg font-black tracking-tight">ACE Engineering College</h1>
                <p class="text-xs font-semibold text-blue-100 mt-1 uppercase tracking-wider">Mentor Password Setup</p>
            </div>
            <div class="p-6 space-y-4">
                <p class="text-xs font-semibold text-slate-500 leading-relaxed">
                    Verify your registered mentor email with a one-time code, then create your login password.
                </p>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Registered Mentor Email</label>
                    <input type="email" id="setupEmail" placeholder="mentor@college.edu" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>

                <button id="sendSetupOtpBtn" onclick="sendSetupOtp()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg text-xs tracking-wider transition shadow-sm">
                    Send Setup OTP
                </button>

                <div id="setupOtpSection" class="hidden space-y-4 pt-1">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-bold text-slate-700">6-Digit OTP</label>
                        <button type="button" onclick="changeSetupEmail()" class="text-[11px] font-bold text-blue-700 hover:text-blue-900">Change email</button>
                    </div>
                    <input type="text" id="setupOtp" maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full text-center tracking-[0.4em] font-mono text-lg font-black border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-600 focus:outline-none">

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
                        <input type="password" id="setupPassword" placeholder="At least 8 characters" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password</label>
                        <input type="password" id="setupPasswordConfirm" placeholder="Re-enter your new password" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>

                    <button id="setupBtn" onclick="submitSetup()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg text-xs tracking-wider transition shadow-sm">
                        Set Password &amp; Sign In
                    </button>
                </div>

                <p id="setupMsg" class="text-xs font-semibold text-center hidden"></p>
                <p class="text-[11px] text-slate-400 text-center leading-relaxed">
                    Already set your password? <a href="/mentor" class="font-bold text-blue-700 hover:text-blue-900">Sign in here</a>.
                </p>
            </div>
        </div>
    </div>

    <script>
        const emailParam = new URLSearchParams(window.location.search).get('email') || '';
        if (emailParam) document.getElementById('setupEmail').value = emailParam.trim();

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
        }

        function setButtonLoading(button, loading, loadingText = 'Please wait...') {
            if (!button) return;
            if (loading) {
                if (!button.dataset.originalHtml) button.dataset.originalHtml = button.innerHTML;
                button.disabled = true;
                button.classList.add('opacity-70', 'cursor-not-allowed');
                button.innerHTML = `<span class="inline-flex items-center justify-center gap-2"><span class="spinner"></span><span>${escapeHtml(loadingText)}</span></span>`;
            } else {
                button.disabled = false;
                button.classList.remove('opacity-70', 'cursor-not-allowed');
                if (button.dataset.originalHtml) {
                    button.innerHTML = button.dataset.originalHtml;
                    delete button.dataset.originalHtml;
                }
            }
        }

        function hideSetupMessage() {
            document.getElementById('setupMsg').classList.add('hidden');
        }

        function showSetupMessage(text, isError) {
            const message = document.getElementById('setupMsg');
            message.classList.remove('hidden', 'text-rose-600', 'text-emerald-700');
            message.classList.add(isError ? 'text-rose-600' : 'text-emerald-700');
            message.innerText = text;
        }

        document.getElementById('setupEmail').addEventListener('keydown', event => {
            if (event.key === 'Enter') sendSetupOtp();
        });
        document.getElementById('setupOtp').addEventListener('keydown', event => {
            if (event.key === 'Enter') submitSetup();
        });
        document.getElementById('setupPassword').addEventListener('keydown', event => {
            if (event.key === 'Enter') submitSetup();
        });
        document.getElementById('setupPasswordConfirm').addEventListener('keydown', event => {
            if (event.key === 'Enter') submitSetup();
        });

        async function sendSetupOtp() {
            const email = document.getElementById('setupEmail').value.trim();
            if (!email) {
                document.getElementById('setupEmail').focus();
                return showSetupMessage('Enter your registered mentor email.', true);
            }
            const button = document.getElementById('sendSetupOtpBtn');
            document.getElementById('setupOtpSection').classList.add('hidden');
            hideSetupMessage();
            setButtonLoading(button, true, 'Sending OTP...');
            try {
                const response = await fetch('/api/mentor/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, purpose: 'setup' })
                });
                const data = await response.json();
                if (data.success) {
                    showSetupMessage(data.message, false);
                    document.getElementById('setupOtpSection').classList.remove('hidden');
                    document.getElementById('setupEmail').disabled = true;
                    // Keep the "Resend OTP" label after the loading state resets.
                    button.dataset.originalHtml = 'Resend OTP';
                    document.getElementById('setupOtp').value = '';
                    document.getElementById('setupOtp').focus();
                } else {
                    showSetupMessage(data.message, true);
                }
            } catch (err) {
                showSetupMessage('Network error. Please retry.', true);
            } finally {
                setButtonLoading(button, false);
            }
        }

        function changeSetupEmail() {
            document.getElementById('setupEmail').disabled = false;
            document.getElementById('setupOtpSection').classList.add('hidden');
            document.getElementById('setupOtp').value = '';
            document.getElementById('setupPassword').value = '';
            document.getElementById('setupPasswordConfirm').value = '';
            const button = document.getElementById('sendSetupOtpBtn');
            button.dataset.originalHtml = 'Send Setup OTP';
            button.innerHTML = 'Send Setup OTP';
            hideSetupMessage();
            document.getElementById('setupEmail').focus();
        }

        async function submitSetup() {
            const email = document.getElementById('setupEmail').value.trim();
            const otp = document.getElementById('setupOtp').value.trim();
            const password = document.getElementById('setupPassword').value;
            const confirm = document.getElementById('setupPasswordConfirm').value;
            if (!otp) return showSetupMessage('Enter the 6-digit OTP sent to your email.', true);
            if (password.length < 8) return showSetupMessage('Password must be at least 8 characters.', true);
            if (password !== confirm) return showSetupMessage('Passwords do not match.', true);
            const button = document.getElementById('setupBtn');
            button.dataset.redirecting = 'true';
            hideSetupMessage();
            setButtonLoading(button, true, 'Setting password...');
            try {
                const response = await fetch('/api/mentor/setup-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, password })
                });
                const data = await response.json();
                if (!data.success) return showSetupMessage(data.message, true);
                showSetupMessage('Password set successfully. Signing you in...', false);
                setTimeout(() => { window.location.href = '/mentor'; }, 800);
            } catch (err) {
                showSetupMessage('Network error. Please retry.', true);
            } finally {
                if (button.dataset.redirecting === 'true') {
                    delete button.dataset.redirecting;
                    return;
                }
                setButtonLoading(button, false);
            }
        }
    </script>
</body>
</html>
